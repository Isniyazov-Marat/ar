<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>3D Robot</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>
<body>

<a-scene background="color:#A3D9FF">

<a-plane position="0 0 -5" rotation="-90 0 0"
scale="15 15 15" color="#7BC8A4"></a-plane>

<a-box position="0 1.5 -5"
scale="1.2 1.2 1" color="#4CC3D9"></a-box>

<a-box position="0 1.6 -5.55"
scale=".7 .4 .05" color="#111"></a-box>

<a-cylinder position="0 2.2 -5"
radius=".15" height=".3" color="#7F8C8D"></a-cylinder>

<a-box position="0 2.65 -5"
scale=".9 .7 .7" color="#4CC3D9"></a-box>

<a-sphere position="-.2 2.75 -5.4"
radius=".12" color="#FFF"></a-sphere>
<a-sphere position=".2 2.75 -5.4"
radius=".12" color="#FFF"></a-sphere>

<a-sphere position="-.2 2.75 -5.51"
radius=".06" color="#007AFF"></a-sphere>
<a-sphere position=".2 2.75 -5.51"
radius=".06" color="#007AFF"></a-sphere>

<a-box position="0 2.58 -5.43"
scale=".12 .15 .1" color="#FFCC00"></a-box>

<a-box position="0 2.4 -5.43"
scale=".4 .08 .05" color="#333"></a-box>

<a-cylinder position="0 3.15 -5"
radius=".03" height=".3" color="#7F8C8D"></a-cylinder>

<a-sphere position="0 3.33 -5"
radius=".07" color="#FFCC00"></a-sphere>

<a-cylinder position="-.85 1.5 -5"
radius=".15" height="1.3" rotation="0 0 10"
color="#FFC65D"></a-cylinder>

<a-cylinder position=".85 1.5 -5"
radius=".15" height="1.3" rotation="0 0 -10"
color="#FFC65D"></a-cylinder>

<a-cylinder position="-.3 .45 -5"
radius=".18" height="1" color="#34495E"></a-cylinder>

<a-cylinder position=".3 .45 -5"
radius=".18" height="1" color="#34495E"></a-cylinder>

<a-light type="ambient" intensity="1"></a-light>
<a-light type="directional" position="2 4 3"></a-light>

<a-camera position="0 1.5 0"></a-camera>

</a-scene>
</body>
</html>
